version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: person-management-postgres
    environment:
      POSTGRES_DB: studs
      POSTGRES_USER: s409858
      POSTGRES_PASSWORD: dmfMuVPpI4Rt35fX
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database-functions.sql:/docker-entrypoint-initdb.d/database-functions.sql
    networks:
      - person-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U s409858 -d studs"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: person-management-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - person-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-client:
    image: minio/mc:latest
    container_name: person-management-minio-client
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/person-imports --ignore-existing;
      mc anonymous set download myminio/person-imports;
      echo 'MinIO bucket setup complete';
      "
    networks:
      - person-network

networks:
  person-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  minio-data:
    driver: local
